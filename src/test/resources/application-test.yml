# 测试专用：H2 内存库（仅单元测试使用，运行时不加载）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gourmet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/h2-data.sql